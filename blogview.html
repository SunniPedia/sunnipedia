<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>প্রবন্ধ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @font-face {
      font-family: 'SolaimanLipi';
      src: url('fonts/SolaimanLipi.ttf') format('truetype');
    }

    body {
      font-family: 'SolaimanLipi', sans-serif;
      background-color: #f4f4f4;
      margin: 0;
    }

.header-toolbar {
  background-color: #01837A;
  color: white;
  position: sticky;
  top: 0;
  z-index: 999;
  padding: 10px 0;
}

.header-content {
  display: flex;
  align-items: center;
  max-width: 100%;
  margin: 0 auto;
  position: relative;
}

.back-button {
  padding: 8px 15px;
  cursor: pointer;
  position: absolute;
  left: 0;
  z-index: 1000;
}

.back-button img {
  width: 20px;
  height: 20px;
  filter: brightness(0) invert(1);
}

.header-title {
  flex-grow: 1;
  text-align: center;
  font-size: 18px;
  padding: 0 50px;
  white-space: nowrap;
  overflow: hidden;
  position: relative;
  width: calc(100% - 70px);
  margin: 0 auto;
}

.header-title span {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 15s linear infinite;
}

@keyframes marquee {
  0% {
    transform: translateX(0);
  }
  100% {
    transform: translateX(-100%);
  }
}

    .controls {
      display: flex;
      justify-content: space-around;
      background-color: #eeeeee;
      padding: 10px;
      position: sticky;
      top: 50px;
      z-index: 998;
    }

    .controls button {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 15px;
      font-size: 14px;
      border: none;
      border-radius: 5px;
      background-color: #009688;
      color: white;
      cursor: pointer;
      font-family: 'SolaimanLipi', sans-serif;
    }

    .controls img {
      width: 16px;
      height: 16px;
    }

.content {
  background-color: #fff;
  padding: 20px;
  margin: 15px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  line-height: 1.6;
  font-size: 18px;
  color: #333;
  white-space: pre-wrap;
}

/* ফন্ট সাবার উপর প্রয়োগ করতে */
.content, .content * {
  font-family: 'SolaimanLipi', sans-serif !important;
}


    .footer {
      text-align: center;
      margin: 20px 0;
      font-size: 14px;
      color: #999;
    }
  </style>
</head>
<body>

<div class="header-toolbar">  
  <div class="header-content">  
    <div class="back-button" onclick="goBack()">  
      <img src="img/back.png" alt="Back">  
    </div>  
    <div class="header-title" id="postTitle">
      <span>অনলাইন প্রবন্ধ</span>
    </div>  
  </div>  
</div>

  <div class="controls">
    
    <button onclick="increaseFont()">আকার+</button>
    <button onclick="decreaseFont()">আকার−</button>
    <button onclick="copyContent()">
      <img src="img/copy.png" alt="Copy"> কপি
    </button>
    <button onclick="shareContent()">
      <img src="img/share.png" alt="Share"> শেয়ার
    </button>
  </div>

  <div class="content" id="postContent">লোড হচ্ছে...</div>

  <div class="footer">©ইসলামী বিশ্বকোষ ব্লগ</div>

  <script>
    let fontSize = 18;
    const post = JSON.parse(sessionStorage.getItem('blogPost'));
    const titleEl = document.getElementById('postTitle');
    const contentEl = document.getElementById('postContent');

    if (post) {
      titleEl.innerHTML = '<span>' + post.title + '</span>';
      contentEl.innerHTML = post.content;
    } else {
      contentEl.innerText = 'কোনো তথ্য পাওয়া যায়নি।';
    }

    function goBack() {
      window.history.back();
    }

    function increaseFont() {
      fontSize += 1;
      contentEl.style.fontSize = fontSize + 'px';
      contentEl.style.lineHeight = (1.6 + fontSize / 100) + '';  // 1.6 এর সাথে ফন্ট সাইজ যোগ করে লাইন স্পেসিং বাড়ানো হবে
    }

    function decreaseFont() {
      if (fontSize > 10) {
        fontSize -= 1;
        contentEl.style.fontSize = fontSize + 'px';
        contentEl.style.lineHeight = (1.6 + fontSize / 100) + '';  // 1.6 এর সাথে ফন্ট সাইজ যোগ করে লাইন স্পেসিং কমানো হবে
      }
    }

    function copyContent() {
      const tempInput = document.createElement('textarea');
      tempInput.value = titleEl.innerText + '\n\n' + contentEl.innerText + '\n\nআসসালামু আলাইকুম ইসলামী বিশ্বকোষ ও আল হাদিস S2\nhttps://play.google.com/store/apps/details?id=com.srizwan.bookhozur500';
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      showToast('লেখাটি কপি করা হয়েছে');
    }

    function shareContent() {
      const textToShare = titleEl.innerText + '\n\n' + contentEl.innerText + '\n\nআসসালামু আলাইকুম ইসলামী বিশ্বকোষ ও আল হাদিস S2\nhttps://play.google.com/store/apps/details?id=com.srizwan.bookhozur500';
      if (navigator.share) {
        navigator.share({ title: 'প্রবন্ধ', text: textToShare }).catch(console.error);
      } else {
        showToast('আপনার ব্রাউজার শেয়ার সাপোর্ট করে না');
      }
    }
    
    // Toast function for displaying message
    function showToast(message) {
        let toast = document.createElement("div");
        toast.style.position = "fixed";
        toast.style.bottom = "30px";
        toast.style.left = "50%";
        toast.style.transform = "translateX(-50%)";
        toast.style.padding = "10px 20px";
        toast.style.backgroundColor = "#333";
        toast.style.color = "white";
        toast.style.borderRadius = "5px";
        toast.style.fontSize = "14px";
        toast.style.zIndex = "9999";
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(function() {
            toast.style.opacity = "0";
            setTimeout(function() {
                document.body.removeChild(toast);
            }, 500);
        }, 3000);
    }
  </script>

</body>
</html>
