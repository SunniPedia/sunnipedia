  <script>
    let fullData = [{"1": "কিছু আপত্তি ও সেগুলোর খন্ডন", "2": "কিছু আপত্তি ও সেগুলোর খন্ডন\nকৃতঃ সাকিব মেসবাহ\nএক লা মাজহাবী ভাই বিদাতের লিস্ট বানালো, সেখান থেকে নেয়া -\n১. রাসূল ﷺ কে নূর মানা- বিদাত\n২. রাসূল ﷺ না হলে, কিছুই সৃষ্টি হত না- একথা মানা বিদাত\n৩. রাসূল ﷺ কে জীবিত ভাবা- বিদাত\n৪. রাসূল ﷺ এর উসিলাতে মাফ চাওয়া- বিদাত\n৫. রাসূল ﷺ এর কবরকে রওজা বলা- বিদাত\n৬. মসজিদে নববীর গম্বুজটা দেখা মাত্র দরুদ পড়া- বিদাত\n৭. আশেকে রাসূল দাবি করা- বিদাত\n৮. বালাগাল উলা কামালিহি - পড়া শির্ক বা বিদাত\n৯. রাসূল ﷺ কে আল্লাহ্'র হাবিব বলা- বিদাত\n\n\n\n-------------------------------------"}, {"1": "🗒️আপত্তি খন্ডন - ১", "2": "--------------------------\nقَدْ جَآءَكُمْ مِّنَ اللّٰهِ نُوْرٌ وَّكِتٰبٌ مُّبِيْنٌ ۙ\nতোমাদের নিকট আল্লাহর পক্ষ হতে জ্যোতি ও স্পষ্ট কিতাব এসেছে।\n\nসুরা মায়েদা ১৫ নং আয়াতের ব্যাখ্যায় অসংখ্য তাফসীরে লেখা হয়েছে - নূর বলতে মুহাম্মদ সা: কে বুঝানো হয়েছে..\n.\n💠তাফসীর ইবনে আব্বাস (আব্দুল্লাহ ইবনে আব্বাস রা: এ লেখা তাফসীর)\n💠তাফসীরে কবির, তাফসীরে রুহুল মা'আনী, তাফসীরে রুহুল বয়ান, তাফসীরে জালালাইন, তাফসীর ইবনে জারীর, তাফসীরে বায়যাবী অন্যতম..\n💠আল বিদায়া ওয়ান নিহায়া খ ২, পৃ ৪৮৭\n💠জাকের নায়েক লেকচার সমগ্র খ ১, পৃ ৪৯৪\n.\n💠মুসান্নাফে আব্দুর রাজ্জাক খ ১, পৃ ৯৯, হাদিস ১৮\nপ্রকাশনী- দার আল মুহাদ্দীস, রিয়াদ, সৌদি আরব\n.\nহযরত জাবের ইবনে আব্দুল্লাহ (রাঃ) হইতে বর্ণিত আছে, “তিনি বলেন- আমি আরজ করলাম, হে রাসুল আল্লাহ্ (সঃ), আপনার উপর আমার পিতা মাতা উৎসর্গিত, আল্লাহতালা সর্বপ্রথম কোন বস্তুটি সৃষ্টি করেছেন? উত্তরে নবী করিম (সঃ) বলেন– হে জাবের, আল্লাহতালা সর্ব প্রথম সমস্ত বস্তুর পূর্বে তোমার নবীর নূর সৃষ্টি করেছেন।\n.\n💠সনদ -\nরাসূল সা: >>জাবির বিন আব্দুল্লাহ রাদ্বিয়্যাল্লাহু আনহু>> মুহাম্মাদ রাহমাতুল্লাহি আলাইহি>>মা’মার বিন রাশীদ>>আব্দুর রাজ্জাক রাহমাতুল্লাহি আলাইহি\n\n💠এবার দেখা যাক প্রখ্যাত মুহাদ্দীগণের মন্তব্য:\n(ক)হাফেজে হাদিস মুহাদ্দীস আব্দুল হক দেহলভী রাহমাতুল্লাহি আলাইহি তাঁর সুবিখ্যাত সিরাত গ্রন্থ ‘মাদারিজ নব্যুওত’ গ্রন্থে হাদীসটিকে হাসান ও সহীহ বলেছেন।\n(খ) আহমাদ ইবন সালীহ (রঃ) বলেন, “আমি একবার আহমাদ বিন হাম্বল (রঃ) কে জিজ্ঞাসা করলাম, আপনি হাদীস শাস্ত্রে আব্দুর রাজ্জাকের থেকে ভালো আর কাউকে পেয়েছেন? আহমাদ বিন হাম্বল (রঃ) বলেন, না”। [আসকলানী, তাহজিবুত তাহজিব ২/৩৩১]\n(গ) হাদীসটির একটি রাবী হলেন মা’মার বিন রাশীদ। উনার সম্পর্কে আহমাদ বিন হাম্বল (রঃ) বলেন, আমি বাসরার সকল হাদীস শাস্ত্রের বিশেষজ্ঞের থেকে মুসান্নাফ আব্দুর রাজ্জাকে মা’মার বিন রাশীদ এর সূত্রে পাওয়া হাদীসগুলো পছন্দ করি।\nইমাম ইবন হাজর আসকলানী (রঃ) উনাকে দক্ষ মুখস্তবীদ, নির্ভরযোগ্য বলেন। [আসকলানী, তাহজিবুত তাহজিব ১/৫০৫]\nমা’মার বিন রাশীদ সূত্রে বর্ণিত বুখারী শারীফের হাদীস সংখ্যা প্রায় ২২৫ এবং মুসলিম শারীফে বর্ণিত হাদীস সংখ্যা প্রায় ৩০০\n.\nএই হাদীস শরীফটিকে আরও যে সমস্ত কিতাবে সহীহ হাদীস হিসেবে মন্তব্য করে দলীল হিসেবে ব্যবহার করা হয়েছে-\n💠দালায়েলুন নবুওয়াত ১৩/৬৩;\n💠মাওয়াহেবুল্লাদুন্নিয়া ১/৯;\n💠মাদারেজুন নবুওয়াত ২/২;\n💠যুরকানী ১/৪৬;\n💠রুহুল মায়ানী ১৭/১০৫;\n💠কাশফুল খফা ১/৩১১;\n💠নশরুতত্বীব ১ম পৃ;\n💠দেওবন্দী আজিজুল হক অনুবাদ কৃত বুখারী শরীফ ৫/৩।\n.\n."}, {"1": "🗒️আপত্তি খন্ডন - ২", "2": "---------------------------\n💠হযরত আবদুল্লাহ ইবনে আব্বাস রাদ্বিআল্লাহু তা’য়ালা আনহু থেকে বর্ণনা করেন, যিনি বলেন: “আল্লাহ পাক হযরত ঈসা আলাইহিস সালাম-কে বলেছেন, ওহে ঈসা! হুযুর পাক সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম -এর প্রতি ঈমান আনুন এবং আপনার উম্মতকেও তা করতে বলুন । রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম না হলে আমি আদমকে সৃষ্টি করতাম না, বেহেশত বা দোযখও সৃষ্টি করতাম না।”\n.\nদলিল:–\n💠 ইমাম হাকিম নিশাপুরী : আল মোসতাদরেক’ : ২/৬৭১ : হাদিস ৪২২৭\n💠ইবনে হাজর আসকালানি : লিসানুল মিযান : ৪/৩৫৪\n💠ইমাম যাহাবী : মিজানুল ইতিদাল : ৫/২৯৯, রাবী নং ৬৩৩৬\n💠 ইবনে কাসীর : সিরাতে নববিয়্যাহ : ১/৩২০\n.\n."}, {"1": "🗒️আপত্তি খন্ডন - ৩", "2": "---------------------------\nহযরত আনাস রাঃ থেকে বর্ণিত।\nরাসূল সাঃ ইরশাদ করেছেন-নবীরা কবরে জীবিত। আর তারা সেখানে নামায পড়েন।\n💠মুসনাদুল বাজ্জার, হাদীস নং-৬৮৮৮,\n💠মুসনাদে আবী ইয়ালা, হাদীস নং-৩৪২৫,\n.\nহযরত আবু দারদা রাঃ থেকে বর্ণিত। রাসূল সাঃ ইরশাদ করেছেন-তোমরা জুমআর দিন বেশি বেশি করে দুরুদ পড়। নিশ্চয় ফেরেস্তারা এর উপর স্বাক্ষ্যি থাকে। আর যখন কেউ আমার উপর দুরুদ পড়ে তখনই তা আমার নিকট পেশ করা হয়। আবু দারদা রাঃ বলেন-আমি জিজ্ঞাসা করলাম-মৃত্যুর পরেও কি তা পেশ করা হবে? উত্তরে তিনি বললেন-হ্যাঁ!, কেননা আল্লাহ তায়ালা জমিনের জন্য নবীদের দেহ ভক্ষণ করা হারাম করে দিয়েছেন।\n\n••💠মুসনাদুল বাজ্জার-৩৪৮৫\n••💠মুসান্নাফে ইবনে আবী শাইবা-৫৭৫৯\n.\nনবী কারীম সাঃ তার কবরে এমন ভাবে জীবিত যে, তার আর কখনও মউত হবে না । তিনি হায়াতে মুছতামির । এবং সমস্ত আম্বিয়া আঃ গন তাদের কবরে জীবিত । আর এটাই আহলে সুন্নাহ ওয়াল জামাতের আকিদা ।\n••💠ফাতহুল বারী খ ৭ পৃ ২৯\n.\n."}, {"1": "🗒️আপত্তি খন্ডন - ৪", "2": "-------------------------\n💠সুরা নিসার ৬৪ নম্বর আয়াতে এসেছে:\n« ﻭَ ﻣﺎ ﺃَﺭْﺳَﻠْﻨﺎ ﻣِﻦْ ﺭَﺳُﻮﻝٍ ﺇِﻻَّ ﻟِﻴُﻄﺎﻉَ ﺑِﺈِﺫْﻥِ ﺍﻟﻠَّﻪِ ﻭَ ﻟَﻮْ ﺃَﻧَّﻬُﻢْ ﺇِﺫْ ﻇَﻠَﻤُﻮﺍ ﺃَﻧْﻔُﺴَﻬُﻢْ ﺟﺎﺅُﻙَ ﻓَﺎﺳْﺘَﻐْﻔَﺮُﻭﺍ ﺍﻟﻠَّﻪَ ﻭَ ﺍﺳْﺘَﻐْﻔَﺮَ ﻟَﻬُﻢُ ﺍﻟﺮَّﺳُﻮﻝُ ﻟَﻮَﺟَﺪُﻭﺍ ﺍﻟﻠَّﻪَ ﺗَﻮَّﺍﺑﺎً ﺭَﺣِﻴﻤﺎً ».\n\n\"আমি রাসূল এ উদ্দেশ্যেই প্রেরণ করেছি, যেন আল্লাহর নির্দেশে তাঁর আনুগত্য করা হয়। যখন তারা নিজেদের উপর যুলম করেছিল, তখন যদি তোমার নিকট চলে আসত আর আল্লাহর কাছে ক্ষমাপ্রার্থী হত এবং রাসূলও তাদের পক্ষে ক্ষমা চাইত, তাহলে তারা আল্লাহকে নিরতিশয় তাওবাহ কবূলকারী ও পরম দয়ালুরূপে পেত।\"\n.\nএই আয়াতের ব্যাখ্যা দিতে গিয়ে ইবনে কাসির বর্ণনা করে: আল্লাহ রাব্বুল আলামিন পাপী বান্দাদেরকে ইরশাদ করছেন যে, নবী করিমকে (সা.) যেন তারা খোদার দরবারে উসিলা করে নেন এবং নিজেও ক্ষমা প্রার্থনা করুক এবং নবী করিমকেও (সা.) আল্লাহর দরবারে তাদের জন্য মাগফেরাত চাওয়ার জন্য বলুক। এমতাবস্থায় আল্লাহর রহমতে শামিল হতে পারবে, তাদের তাওবাও কবুল করা হবে। অতঃপর (ইবনে কাসির) উদাহরণস্বরূপ নবীর (সা.) কবরে একজন আরব লোকের তাওয়াস্সুলের ঘটনা ও খোদার ক্ষমার বর্ণনা করে।\n.\nআল উতবী রহ: রাসূলের রওজার পাশে ছিলেন, এমন সময় এক আরব লোক এল রাসূলের রওজার পাশে এসে ঐ লোক নিজের পাপ মর্জনা করার জন্য রাসূলের নিকট আবেদন জানাচ্ছেন, যেন রাসূল সা: আল্লাহ্'কে বলে দেন তার পাপ ক্ষমা করে দেয়ার জন্য..\nএরপর লোকটি নিচের পংক্তি আবৃত্তি করেন :\n\n**যাহাদের অস্থিসমূহ প্রান্তরে প্রোথিত হয়েছে, আর সেই অস্থি সমূহের দ্বারা উচ্চভূমি নিম্নভূমি উভয়েই সুরভিত হয়ে হয়েছে, তাদের মধ্যে আপনি ই শ্রেষ্ঠতম..\nহে শ্রেষ্ঠতম!\nযিনি এই রওজাতে শুয়ে আছেন, তাঁর জন্য আমার প্রাণ উৎসর্গিত হোক..\nতাতে মহানুবতা, পবিত্রতা ও দানশীলতা আছে..**\nএসব বলে লোকটি চলে গেলেন..\n\nএরপর আল উতবী রহ: ঘুমিয়ে পড়লেন, রাসূল সা: তার স্বপ্নে এলেন.. বললেন - ঐ লোকটিকে বলে দিও - তার গুণাহ সমূহ মাফ করে দেয়া হয়েছে..\n\n💠💠(ইবনে কাসির, খ:৩ _ পৃষ্ঠা: ১৬১-১৬২)\n\n------ইবনে কাসীর রহ: কে মানুন At Least, উনি ইবনে তাইম্যিয়া'র শিষ্য ছিলেন.. যিনি Maximum সময়, ইবনে তাইম্যিয়ার সঙ্গে থাকতেন...\n.\n.\nইমাম কুরতুবি রহ: হযরত আলী (রা.) হতে অনুরূপ একটি রেওয়ায়েত বর্ণনা করেন:\n\nআবু সাদেক আযদি রহ: হযরত আলী (রা.) হতে বর্ণনা করে যে, একজন আরব লোক রাসুলুল্লাহর (সা.) দাফনের তিন দিন পর নিজেক তাঁর কবরের উপর ফেলে দিয়ে তার ধুলো মাটি নিয়ে নিজের মাথায় ঢালছিল আর বলছিল: হে ! আল্লাহর রাসুল (সা.) আপনার বাণী শুনেছি, আমরা আপনার কাছে চাচ্ছি আর আপনি খোদার কাছে চান । যে আয়াত আপনার উপর অবতীর্ণ হয়েছে তা হচ্ছে এই যে, “যদি আমার কোন বান্দা নিজের উপর যুলুম অত্যাচার করে, তারা তোমার কাছে আসবে তুমি তাদের জন্য ক্ষমা প্রার্থনা করো আর আল্লাহ রাব্বুল আলামিনও তাদের তাওবা কবুল করবেন”, আমি নিজের উপর যুলুম করেছি, এখন এসেছি যাতে আপনি আমার জন্য খোদার দরবারে মাগফেরাত ও ক্ষমা কামনা করেন; অতঃপর নবী করিমের (সা.) কবর থেকে আওয়াজ এলো যে, তোমার মার্জনা হয়েছে।\n💠💠(কুরতুবি, ৫ম খন্ড, পৃষ্ঠা: ২৬৫)\n.\nইমাম ইবনে হিব্বান (রহ:) নিজের অভিজ্ঞতা বর্ণনাকালে আল-রেযা (রহ:)-এর মাযারে তাঁর তাওয়াসসুলের বিবরণ লিপিবদ্ধ করেন এবং বলেন, “তুস্ নগরীতে অবস্থান করার সময় যখনই আমি কোনো সমস্যা দ্বারা পেরেশানগ্রস্ত হয়েছি, তৎক্ষণাৎ আমি হযরত আলী ইবনে মূসা রেযা (তাঁর নানা তথা হুযূর পাক ও তাঁর প্রতি আল্লাহর রহমত বর্ষিত হোক)-এর মাযার শরীফ যেয়ারত করতাম এবং আল্লাহর কাছে সমাধান চাইতাম। এতে আমার দোয়া কবুল হতো এবং পেরেশানিও দূর হতো। আমি এটি-ই করতাম এবং বহুবার এর সুফল পেয়েছি।”\n💠💠[ইবনে হিব্বান প্রণীত ‘কিতাবুস্ সিকাত’,হাদিস: ১৪৪১১]\n.\n."}, {"1": "🗒️আপত্তি খন্ডন - ৫", "2": "-------------------------\nরওজা মানে হল - জান্নাতের বাগান..\nকেমন উম্মত সে - যে কিনা রাসূল যেখানে শায়িত হয়েছেন সে স্থান কে জান্নাতের বাগান মানতে পারে না...?\n\nরাসূলুল্লাহ সাল্লাল্লাহু আলাইহি বলেছেন, কবর হল জান্নাতের উদ্যানসমুহের একটি উদ্যান, অথবা জাহান্নামের গর্তসমূহের একটি গর্ত।\n💠তিরমিজি - ২৪৬০\n\nরাসূলুল্লাহ্ ﷺ এর কবর জান্নাতের বাগান, Any doubt here?\n.\n."}, {"1": "🗒️আপত্তি খন্ডন- ৬", "2": "------------------------\nহে মুমিনগণ! তোমরাও তাঁর (রাসুলুল্লাহ্ সা: এর) প্রতি দরূদ পড় এবং অধিক পরিমাণে সালাম পাঠাও।’\n💠(সুরা আহজাব : আয়াত ৫৬)\n\nফতোয়া আল্লাহ্'কে দেন গিয়ে 🤣\n\nহাদিস থেকে -\nহজরত আমের ইবনে রবীআহ রাদিয়াল্লাহু আনহু বলেন, ‘আমি রাসুলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লামকে খুতবার মধ্যে এ কথা বলতে শুনেছি- ‘যে আমার উপর দরূদ পাঠকারী যতক্ষণ দরূদ পড়ে ফেরেশতারা তার জন্য দোয়া করতে থাকে। সুতরাং বান্দার ইচ্ছা, সে দরূদ বেশি পড়বে না কম।’\n💠(মুসনাদে আহমদ, ইবনে মাজাহ, মুসান্নাফ ইবনে আবি শাইবা)\n\nহজরত রুওয়াইফি ইবনে ছাবিত আল-আনসারী রাদিয়াল্লাহু আনহু বর্ণনা করেন, ‘রাসুলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ইরশাদ করেছেন, ‘যে ব্যক্তি আমার উপর দরূদ পাঠ করবে তার জন্য আমার সুপারিশ অবধারিত হয়ে যাবে।’\n💠(তাবারানি)\n\n>> হজরত আব্দুল্লাহ ইবনে মাসউদ রাদিয়াল্লাহু আনহু বর্ণনা করেন, রাসুলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বলেছেন, ‘কেয়ামতের দিন ওই ব্যক্তি আমার সবচেয়ে নিকটবর্তী হবে, যে আমার উপর সবচেয়ে বেশি দরূদ পড়েছে।’\n💠(তিরমিজি)\n.\nদরূদ পড়া মাকরুহে তাহরীমি যে সমস্ত সময়ে :\n\nসাতস্থানে দরূদশরীফ পাঠ করা মাকরূহে তাহরিমী\n১. সহবাসের করার সময়\n২. প্রস্রাব পায়খানার সময়\n৩. ব্যবসার মাল প্রকাশ করার সময়\n৪. হোচট খেয়ে পড়ে গেলে\n৫. কোন কিছুতে আশ্চর্য হলে\n৬. জীবজন্তু জবেহ করার সময়\n৭. হাই তোলার সময়।\n💠রদ্দুল মুহতার ৫১৮ পৃষ্ঠা\n\nএই সময় ছাড়া অন্য সকল সময়ে দরুদ পড়া যাবে..\n.\nভাই, এবার রাসূল কেন দরুদ পড়তে বললো, রাসূল কে'ও ফতোয়া দিয়ে দিন গিয়ে 🤣\n.\n."}, {"1": "🗒️আপত্তি খন্ডন- ৭ :", "2": "-----------------------\nইমাম ত্ববারী রাহ. বলেছেন\n\nأن الله أرسل نبيه محمدا صلى الله عليه وسلم رحمة لجميع العالم، مؤمنهم وكافرهم. فأما مؤمنهم فإن الله هداه به، وأدخله بالإيمان به، وبالعمل بما جاء من عند الله الجنة. وأما كافرهم فإنه دفع به عنه عاجل البلاء الذي كان ينزل بالأمم المكذّبة رسلها من قبله.\n\nনবী কারীম সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম জগতের সকলের প্রতি আল্লাহ পাকের রহমত। মুমিন-কাফির নির্বিশেষে সকল মাখলুকই কিয়ামত পর্যন্ত এই মহান রহমতের মাধ্যমে উপকৃত হতে থাকবে। মুমিনকে তো আল্লাহ তাআলা তাঁর মাধ্যমে হিদায়াত দান করেছেন। তাঁর উপর ঈমান আনা এবং তিনি আল্লাহ তাআলার পক্ষ থেকে যে পয়গাম নিয়ে এসেছেন সে অনুযায়ী আমল করার কারণে তাকে জান্নাত দেবেন। আর এই উম্মতের অবিশ্বাসীকে তাঁর কারণে পূর্ববর্তী উম্মতের অবিশ্বাসীর মতো নগদ শাস্তি দেবেন না।\n💠তাফসীরে ত্ববারী ১৮/৫৫২\n.\nআব্দুল্লাহ ইবনে হিশাম রা. বলেন\nكُنّا مَعَ النّبِيِّ صَلّى اللهُ عَلَيْهِ وَسَلّمَ وَهُوَ آخِذٌ بِيَدِ عُمَرَ بْنِ الخَطّابِ، فَقَالَ لَهُ عُمَرُ: يَا رَسُولَ اللهِ، لَأَنْتَ أَحَبّ إِلَيّ مِنْ كُلِّ شَيْءٍ إِلّا مِنْ نَفْسِي، فَقَالَ النّبِيّ صَلّى اللهُ عَلَيْهِ وَسَلّمَ: لاَ، وَالَذِي نَفْسِي بِيَدِهِ، حَتّى أَكُونَ أَحَبّ إِلَيْكَ مِنْ نَفْسِكَ، فَقَالَ لَهُ عُمَرُ: فَإِنّهُ الآنَ، وَاللهِ، لَأَنْتَ أَحَبّ إِلَيّ مِنْ نَفْسِي، فَقَالَ النّبِيّ صَلّى اللهُ عَلَيْهِ وَسَلّمَ: الآنَ يَا عُمَرُ!\nএকদিন আমরা নবীজী সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের সাথে ছিলাম। নবীজী ওমর রা.-এর হাত ধরা ছিলেন। ওমর রা. বলে উঠলেন, ইয়া রাসূলাল্লাহ! আপনি আমার কাছে সবকিছু থেকে প্রিয়, তবে আমার জান ছাড়া। তখন নবীজী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, না ওমর, এতে হবে না। যে সত্তার হাতে আমার জান তাঁর কসম! (ততক্ষণ পর্যন্ত তুমি পূর্ণাঙ্গ মুমিন হতে পারবে না,) যতক্ষণ না আমি তোমার কাছে তোমার জানের চেয়েও প্রিয় না হই। পরক্ষণেই ওমর রা. বললেন, হাঁ এখন তা হয়েছে; আল্লাহর কসম! (এখন থেকে) আপনি আমার কাছে আমার জানের চেয়েও প্রিয়। তখন নবীজী সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম বললেন, হাঁ ওমর! এখন হয়েছে।\n💠সহীহ বুখারী, তাফসীর ইবনে কাসীর খ ৯, পৃ ৩০-৩৩\n.\nআনাস ইবনু মালিক (রাযিঃ) হতে বর্ণিত। তিনি বলেন, নাবী সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম বলেছেনঃ তোমরা ততক্ষণ পর্যন্ত মুমিন হতে পারবে না, যতক্ষণ পর্যন্ত তোমরা যা পছন্দ করো তা অন্য ভাইয়ের জন্যও পছন্দ করবে। আরো বর্ণনায় রয়েছে, প্রতিবেশীর জন্যও পছন্দ করবে।\n💠মুসলিম ৭৪\n\n💚সাহাবীগণের নবীপ্রেমের কিছু নমুনা\n\nনবী কারীম সাল্লাল্লাহু আলাইহি ওয়াসাল্লামকে ভালবাসার ক্ষেত্রে সর্বোচ্চ স্তরে উন্নীত ছিলেন সাহাবায়ে কেরাম রিযওয়ানুল্লাহি তাআলা আলাইহিম আজমাঈন। তাঁরা সত্যিকারের নবীপ্রেমের বেনজীর দৃষ্টান্ত স্থাপন করে গেছেন।\n\nহযরত আবু সুফিয়ান রা. ইসলাম গ্রহণের আগেই এই স্বীকারোক্তি দিয়েছেন\n\nما رأيت من الناس أحدا يحب أحدا كحب أصحاب محمد صلى الله عليه وسلم محمدا\n\nঅর্থাৎ, আমি কাউকে এতটা ভালবাসতে দেখিনি, মুহাম্মদ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামকে তাঁর সঙ্গীরা যতটা ভালবাসে।\n💠সীরাতে ইবনে হিশাম ২/১৭২\n\nএমনিভাবে হযরত উরওয়া ইবনে মাসঊদ রা. ইসলাম গ্রহণের আগে হুদাইবিয়ার সন্ধির সময় মুশরিকদের পক্ষ হয়ে কথা বলতে এসেছিলেন। রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের সঙ্গে আলাপ-আলোচনার পর তিনি নিজ কওমের নিকট এই অনুভূতি পেশ করেছিলেন\n\nوَاللهِ لَقَدْ وَفَدْتُ عَلَى المُلُوكِ، وَوَفَدْتُ عَلَى قَيْصَرَ، وَكِسْرَى، وَالنّجَاشِيِّ، وَاللهِ إِنْ رَأَيْتُ مَلِكًا قَطّ يُعَظِّمُهُ أَصْحَابُهُ مَا يُعَظِّمُ أَصْحَابُ مُحَمّدٍ مُحَمّدًا، وَاللهِ إِنْ تَنَخّمَ نُخَامَةً إِلّا وَقَعَتْ فِي كَفِّ رَجُلٍ مِنْهُمْ، فَدَلَكَ بِهَا وَجْهَهُ وَجِلْدَهُ، وَإِذَا أَمَرَهُمْ ابْتَدَرُوا أَمْرَهُ، وَإِذَا تَوَضَأَ كَادُوا يَقْتَتِلُونَ عَلَى وَضُوئِهِ.\n\nঅর্থাৎ, আমি অনেক রাজা বাদশাহদের কাছে প্রতিনিধি হয়ে গিয়েছি। কায়সার কিসরা ও নাজাশীর কাছেও গিয়েছি। আল্লাহর কসম! মুহাম্মাদ (সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম)-কে তার সঙ্গীরা যেভাবে ভক্তি করে সেভাবে আমি আর কাউকে দেখিনি তাদের বাদশাহকে ভক্তি করতে। আল্লাহর কসম! তিনি থুথু ফেললেই তাদের কেউ না কেউ তা হাতে নিয়ে নেয় এবং তা চেহারায় ও শরীরে মাখে। তিনি যখন তাদেরকে আদেশ করেন তখন তারা তাঁর আদেশ পালনে ঝাঁপিয়ে পড়ে। আর যখন তিনি অযু করেন তখন তাঁর ওযুতে ব্যবহৃত পানি পাওয়ার জন্য লড়াই করার উপক্রম হয়।\n💠সহীহ বুখারী\n\nহযরত আনাস রা. বলেন\nلَقَدْ رَأَيْتُ رَسُولَ اللهِ صَلّى اللهُ عَلَيْهِ وَسَلّمَ وَالْحَلّاقُ يَحْلِقُهُ، وَأَطَافَ بِهِ أَصْحَابُهُ، فَمَا يُرِيدُونَ أَنْ تَقَعَ شَعْرَةٌ إِلّا فِي يَدِ رَجُلٍ.\n\nঅর্থাৎ, আমি রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামকে দেখেছি, তাঁর চুল মুবারক মু-ন করা হচ্ছে আর তাঁর সাহাবীরা তাঁকে ঘিরে আছে। তাঁরা চাইছিলেন তাঁর একটি চুলও যেন মাটিতে না পড়ে। বরং কারো না কারো হাতেই পড়ে।\n💠সহীহ মুসলিম\n\nহযরত আবু বকর সিদ্দীক রা. মৃত্যুশয্যায় আয়েশা সিদ্দীকা রাযিয়াল্লাহু আনহাকে জিজ্ঞাসা করলেনÑ\n\nفِي أَيِّ يَوْمٍ تُوُفِّيَ رَسُولُ اللهِ صَلّى اللهُ عَلَيْهِ وَسَلّمَ؟ قَالَتْ: يَوْمَ الِاثْنَيْنِ، قَالَ: فَأَيّ يَوْمٍ هَذَا؟ قَالَتْ: يَوْمُ الِاثْنَيْنِ، قَالَ: أَرْجُو فِيمَا بَيْنِي وَبَيْنَ اللّيْلِ.\n\nনবীজি সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম কোন্ দিন ইন্তেকাল করেছেন? আয়েশা রা. জানালেন, সোমবার। তিনি বললেন, আজ কী বার? জবাব দিলেন, সোমবার। তখন তিনি বললেন, হায় যদি আমার মওত রাতের আগেই হতো!\n💠সহীহ বুখারী\n\nভালবাসার দৃষ্টান্ত দেখুন। আমার মৃত্যুও যেন হয় সে দিনে, যে দিনে প্রেমাষ্পদের মৃত্যু হয়েছিল।\n\nউহুদ যুদ্ধেরই ভয়াবহ মুহূর্তে আরেক সাহাবী হযরত আবু তালহা রা. নিজে ঢাল হয়ে রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়াসাল্লামের উপর আক্রমণ প্রতিহত করছিলেন। একপর্যায়ে যখন নবীজী উঁকি দিয়ে দেখতে উদ্যত হলেন তখন আবু তালহা রা. বলে উঠলেন\n\nيَا نَبِيّ اللهِ، بِأَبِي أَنْتَ وَأُمِّي، لاَ تُشْرِفْ يُصِيبُكَ سَهْمٌ مِنْ سِهَامِ القَوْمِ، نَحْرِي دُونَ نَحْرِكَ.\n\nইয়া রাসূলুল্লাহ, আমার মা-বাবা আপনার জন্য কুরবান হোক! আপনি উঁকি দেবেন না; পাছে আপনার গায়ে কোনো তীর এসে লাগে। আমার বুক আপনার জন্য উৎসর্গিত।\n💠সহীহ বুখারী\n\nএরা আশেকে রাসূল ছিলে প্রত্যেকেই..\nআশেক মানে যে ভালোবাসে..\n.\nচোখে শির্কের চশমা লাগিয়ে রাসূলের প্রতি ভালোবাসা দেখতে পাবা, এটা ভাবাটাও বোকামি!\n.\n."}, {"1": "🗒️আপত্তি খন্ডন - ৫", "2": "-------------------------\n\nবালাগাল উলা বি কামালিহি,\n\nকাশাফাদ্দুজা বি জামালিহি,\n\nহাসুনাত জামিয়ু খিসালিহি,\n\nসাল্লু আলায়হে ওয়া আলিহি...\n\nঅর্থ :\n-------\nতিনি পৌঁছে গেছেন সর্বোচ্চ মর্যাদায় তাঁর সুমহান চরিত্রের দ্বারা।\n\nবিদুরিত হয়েছে সকল অন্ধকার তাঁর সৌন্দর্যের ছটায়।\n\nসম্মিলন ঘটেছে তাঁর মাঝে সকল উন্নত চরিত্রের।\n\nপেশ করুন তাঁর প্রতি ও তাঁর  সম্মানিত আহলু বাইত শরীফ আলাইহিমুস সালাম উনাদের প্রতি দরুদ ও সালাম।\n.\nতার লেখা জনপ্রিয় ‘কাশিদা’ নিয়ে (বালাগাল উলা বি কামালিহি/কাশাফাদ্দুজা বি জামালিহি/হাসুনাত জামিয়ু খিসালিহি/সাল্লু আলায়হে ওয়া আলিহি) একটি ঘটনা আছে।\n.\nমহাকবি সাদি বালাগাল উলা বি কামালিহি কবিতাটি প্রথম তিন লাইন লিখেন আর মিলাতে পারছিলেন না। তিন লাইন লিখে আর শেষের লাইন না লিখে তিনি ঘুমিয়ে পড়েছিলেন। তখন ঘুমের মধ্যে স্বপ্নে স্বয়ং রাসূল সাল্লাল্লাহু আলাইহে ওয়া সাল্লাম বিশেষভাবে আসলেন। রাসূলাল্লাহ (সা.) বললেন, হে শেখ সাদী! আপনি এত অস্থির কেন? কি হয়েছে আপনার? হজরত শেখ সাদী রহমতুল্লাহি আলাইহি সেই লেখা না লিখতে পারার ব্যর্থতা ও অপারগতার বিষয়ে নবীজিকে জানান। তখন রাসূলে পাক সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম ইরশাদ করলেন, আপনি চতুর্থ লাইন লিখুন,\n‘সাল্লু আলায়হে ওয়া আলিহি’ (সুবহানাল্লাহ)\n\nঅর্থাৎ, ‘উনার প্রতি এবং উনার সম্মানিত আহলু বাইত শরীফ আলাইহিমুস সালাম উনাদের প্রতি দরুদ পাঠ করো।’\n\nএভাবেই শেষোক্ত লাইন ‘সাল্লু আলায়হে ওয়া আলিহি’ রাসূল (সা.) বিশেষ সাক্ষাতে বলে যান হজরত শেখ সাদি রহমতুল্লাহি আলাইহিকে। এই কাশিদা পরবর্তীতে মহাকবিকে খ্যাতির শীর্ষে নিয়ে যায়।\n\nকুরআন হতে দলিল :\n-------------------------\nআমাদের প্রিয়নবী মুহাম্মদ সা: ছিলেন উত্তম চরিত্র ও মাধুর্যপূর্ণ আচরণের অধিকারী। এ বিষয়ে স্বয়ং আল্লাহ তায়ালাই প্রশংসা করে বলেন, তুমি অবশ্যই মহান চরিত্রে অধিষ্ঠিত। (সূরা আল-কালাম : ৪)\n\n‘তোমাদের মধ্যে যাহারা আল্লাহ্ ও আখিরাতকে ভয় করে এবং আল্লাহ্'কে অধিক স্মরণ করে তাহাদের জন্য তো রাসূলুল্লাহর মধ্যে রহিয়াছে উত্তম আদর্শ।’ (সূরা আল-আহজাব : ২১)\n.\nআল্লাহ্ নিজেই ঘোষণা দিয়েছেন : রাসূলের চরিত্রে উত্তম আদর্শ আছে..\nআল্লাহ্'কে ফতোয়া দিবা এখন...? 🤣\n.\nআরে ভাই, চরিত্রিক গুণে এত উপরেই উনার সম্মান ছিল যে - মুনাফিক মুশরেকরা ইমান না আনা সত্ত্বেও আলামীন বা বিশ্বাসী বলে ডাকতো..\n.\nএটা কি অন্যান্য মর্যাদা নয়?\n.\nরাসূলের মর্যাদা কত টুকু?\nডিফাইন করার মত কেউ নেই..\nযাঁর সম্মান আরশে আজীমে,  তাঁর প্রসংশা কতটুকুই বা করতে পারবেন?\n\nহাদিসে রাসূলের যেসব মর্যাদার কথা বলা আছে, তা দেখলে তো শির্কের ফতোয়া লাগাবেন...\n\nগুগল এ সার্চ করবেন - ** Poem Of hassan bin sabit Ra. about Muhammad S.a.w ** লিখে..\nদেখবেন,\nসাহাবী হাসসান বিন সাবিত রা: এর লেখা কবিতার কাছে শেখ সাদী রহ: এর লেখা কবিতাতে রাসূলের মর্যাদা খুব কম'ই বর্ণিত হয়েছে..\nকবিতা গুলো শির্কের চশমা পরিধান করে যখন পড়বেন, তখন শির্কের গন্ধ পাবেন.. আর মুহাব্বত নিয়ে পড়লে সেখানে রাসূলের প্রতি সাহাবাদের ভালোবাসা এবং স্থানটা কত উপরে ছিল সেটা পাবেন..\n.\n."}, {"1": "🗒️আপত্তি খন্ডন ৯", "2": "-----------------------\nআমর ইবনু কায়েস রাদ্বিযাল্লাহু আনহু হতে বর্ণিত, রাসূলুল্লাহ সাল্লাল্লাহু আলাইহি ওয়া সাল্লাম বলেছেন: ‘আল্লাহ আমাকে রহমত লাভের সময় (তথা মৃত্যুর সময়) সম্পর্কে জানিয়ে দিয়েছেন। আর আমার (আয়ুষ্কাল) অত্যন্ত সংক্ষিপ্ত করেছেন। (দুনিয়াতে) আমরা পরে আগমনকারী হলেও আখিরাতে আমরা অগ্রগামী। আমি কোন অহংকার ব্যতীতই একটি কথা বলছি: ইবরাহীম খলীলুল্লাহ, মুসা সফীউল্লাহ (খাঁটি বন্ধু), আর আমি হাবীবুল্লাহ।”\n\n💠কানযুল উম্মাল ৩২০৮০\n.\nহাবীবুল্লাহ্ মানে আল্লাহ্'র       const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = '';
      dataArray.forEach((item, index) => {
        if (!item["1"]) return;
        const isEmpty2 = !item["2"] || item["2"].trim() === '';
        const bgColor = isEmpty2 ? '#01837A' : '#fff';
        const fgColor = isEmpty2 ? '#fff' : '#01837A';
        const textAlign = isEmpty2 ? 'center' : 'left';
        const div = document.createElement('div');
        div.className = 'content-item';
        div.style.backgroundColor = bgColor;
        div.onclick = () => openView(index);
        div.innerHTML = `
          <h2 style="color: ${fgColor}; text-align: ${textAlign}">
            ${convertToBanglaNumber(index + 1)}
          </h2>
          <p style="color: ${fgColor}; text-align: ${textAlign}">
            ${item["1"]}
          </p>`;
        contentDiv.appendChild(div);
      });
    }

    function openView(index) {
      const keyValue = fullData[index]["1"];
      const encodedKey = encodeURIComponent(keyValue);
      const encodedBookName = encodeURIComponent("কিছু আপত্তি ও সেগুলোর খন্ডন");
      window.location.href = `view.html?bookid=%E0%A6%95%E0%A6%BF%E0%A6%9B%E0%A7%81%20%E0%A6%86%E0%A6%AA%E0%A6%A4%E0%A7%8D%E0%A6%A4%E0%A6%BF%20%E0%A6%93%20%E0%A6%B8%E0%A7%87%E0%A6%97%E0%A7%81%E0%A6%B2%E0%A7%8B%E0%A6%B0%20%E0%A6%96%E0%A6%A8%E0%A7%8D%E0%A6%A1%E0%A6%A8&name=${encodedBookName}&key=${encodedKey}&index=${index}`;
    }

    function copyShortLink() {
      const longUrl = window.location.href;
      fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`)
        .then(res => res.text())
        .then(shortLink => {
          navigator.clipboard.writeText(shortLink)
            .then(() => alert('শর্ট লিংক কপি করা হয়েছে:\n' + shortLink))
            .catch(() => alert('ক্লিপবোর্ডে কপি করতে সমস্যা হয়েছে'));
        })
        .catch(error => {
          alert('লিংক শর্ট করতে সমস্যা হয়েছে');
        });
    }
  </script>
</body>
