<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>আল কুরআন সার্চ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ইসলামী বিশেকোষ ও আল হাদিস S2 - আল কুরআন, হাদিস, ইসলামী বই ও ইসলামী তথ্য ভান্ডারের সমাহার">
  <meta property="og:title" content="ইসলামী বিশ্বকোষ ও আল হাদিস S2">
  <meta property="og:description" content="ইসলামী বিশেকোষ ও আল হাদিস S2 - আল কুরআন, হাদিস, ইসলামী বই ও ইসলামী তথ্য ভান্ডারের সমাহার">
  <meta property="og:image" content="https://islamipedia.vercel.app/icon.png">
  <link rel="stylesheet" href="quransearch.css" />
</head>
<body>
  <div class="toolbar">
    <div style="display: flex; align-items: center; gap: 10px;">
      <img src="img/back.png" alt="Back" class="icon-img" onclick="goBack()" />
      <div class="toolbar-title">আল কুরআন সার্চ</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding-right: 5px;">
      <img src="img/search.png" alt="Search" class="icon-img" onclick="toggleSearch()" />
    </div>
  </div>

  <div id="searchBox" style="display: block;">
    <input type="text" id="searchInput" placeholder="আয়াত অনুসন্ধান করুন..." autocomplete="off" />
  </div>

  <div id="loading">লোড হচ্ছে...</div>
  <div id="ayahList"></div>

  <div class="audio-controller" id="audioController">
    <img src="img/next.png" onclick="playPrevious()" alt="Previous" class="next-icon" />
    <img src="img/pause.png" id="mainPlayPause" onclick="toggleMainPlayPause()" alt="Play/Pause" />
    <img src="img/next.png" onclick="playNext()" alt="Next" />
    <img src="img/stop.png" onclick="stopAudio()" alt="Stop" />
  </div>

  <script src="quransearch.js"></script>
</body>
</html>
